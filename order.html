<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Place Order - Milk Chacha</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header>
    <h1>🥛 Milk Chacha</h1>

    <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/products">Products</a>
        <a href="/logout">Logout</a>
    </nav>
</header>

<div class="login-box">

    <h2>Place Your Order</h2>

    <form action="/order" method="POST">

        <input type="text"
               name="product_name"
               value="{{ product }}"
               readonly>

        <input type="number"
               name="quantity"
               placeholder="Quantity"
               min="1"
               required>
          <p id="total">
             Total: ₹{{ price }}
          </p>     

        <input type="number"
               name="price"
               value="{{ price }}"
               readonly>

        <button type="submit">
            Place Order
        </button>

    </form>

</div>

</body>
</html>
